name: 지표별 외부환경 분석 (주간)

on:
  schedule:
    - cron: '0 23 * * 0'  # 매주 월요일 오전 8시 KST (UTC 일요일 23시)
  workflow_dispatch:       # 수동 실행 시 아래 옵션 선택 가능
    inputs:
      run_news:
        description: '뉴스 기반 외부환경 분석 실행'
        type: boolean
        default: true
      run_market:
        description: '시장 통계(금리·가격지수) 수집 실행'
        type: boolean
        default: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 뉴스 기반 외부환경 분석
        if: github.event_name != 'workflow_dispatch' || inputs.run_news == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node .github/scripts/analyze_indicators.js

      - name: 시장 통계(금리·가격지수) 수집
        if: github.event_name != 'workflow_dispatch' || inputs.run_market == true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node .github/scripts/fetch_market_stats.js
