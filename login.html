<title>성과지표 현황판 · 로그인</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(140% 120% at 50% -10%, #12305f 0%, #0a1f44 38%, #061534 100%);
  }
  .card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 40px; width: 100%; max-width: 380px;
  }
  .logo { height: 32px; width: auto; display: block; margin: 0 auto 16px; }
  h1 { text-align: center; color: #fff; font-size: 20px; font-weight: 600; margin: 0; }
  .sub { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 8px; margin-bottom: 32px; }
  input {
    width: 100%; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 15px; outline: none;
  }
  input::placeholder { color: #64748b; }
  input:focus { border-color: #60a5fa; }
  input[data-code] { text-align: center; letter-spacing: 0.3em; }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: #2563eb; color: #fff; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: opacity .15s;
  }
  button:hover:not(:disabled) { background: #3b82f6; }
  button:disabled { opacity: 0.4; cursor: default; }
  .err { color: #fb7185; font-size: 13px; text-align: center; margin: 0 0 12px; min-height: 16px; }
  .foot { color: #334155; font-size: 12px; margin-top: 32px; text-align: center; }
</style>

    <h1>성과지표 현황판</h1>
    <div class="sub">이름과 OTP 6자리 코드를 입력하세요</div>
    <input id="username" type="text" placeholder="이름 (예: 홍길동)" autocomplete="username">
    <input id="otpCode" data-code type="text" inputmode="numeric" maxlength="6" placeholder="6자리 코드" autocomplete="one-time-code">
    <p class="err" id="err"></p>
    <button id="submitBtn">확인</button>
  </div>
  <p class="foot">2026년도 내부관리용</p>

<script>
(function () {
  'use strict';

  // ── 배포 시 실제 값으로 치환됨 (index.html 빌드 스크립트와 동일 규칙) ──
  var OTP_ENDPOINT = 'https://iswrrkelwqrdqnuhhaih.supabase.co/functions/v1/quick-responder';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlzd3Jya2Vsd3FyZHFudWhoYWloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDYxMzYsImV4cCI6MjA5NzE4MjEzNn0.jfzDTMRv-aw_WgK2-LKeFbbOHJ-sd7cUk8thcoTKlX8';
  var APP_PAGE = 'app.html';

  function isJwtShaped(t) {
    if (typeof t !== 'string') return false;
    var parts = t.split('.');
    if (parts.length !== 3) return false;
    return parts.every(function (p) { return p.length > 0 && /^[A-Za-z0-9_-]+$/.test(p); });
  }

  // 이미 유효한 토큰을 갖고 있으면 바로 대시보드로 이동 (재로그인 불필요)
  try {
    if (sessionStorage.getItem('hug_auth') === '1' && isJwtShaped(sessionStorage.getItem('hug_token'))) {
      location.replace(APP_PAGE);
      return;
    }
  } catch (e) {}

  var usernameEl = document.getElementById('username');
  var codeEl = document.getElementById('otpCode');
  var errEl = document.getElementById('err');
  var btnEl = document.getElementById('submitBtn');

  codeEl.addEventListener('input', function () {
    codeEl.value = codeEl.value.replace(/[^0-9]/g, '');
  });

  function setLoading(loading) {
    btnEl.disabled = loading;
    btnEl.textContent = loading ? '확인 중...' : '확인';
  }

  async function submit() {
    var username = usernameEl.value.trim();
    var code = codeEl.value.trim();
    errEl.textContent = '';

    if (!username) { errEl.textContent = '이름을 입력해주세요.'; return; }
    if (!code || code.length !== 6) { errEl.textContent = '6자리 코드를 입력해주세요.'; return; }

    setLoading(true);
    try {
      var res = await fetch(OTP_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SB_KEY },
        body: JSON.stringify({ username: username, token: code })
      });

      if (res.status === 429) {
        var locked = await res.json().catch(function () { return {}; });
        var mins = Math.ceil((locked.retry_after_seconds || 600) / 60);
        errEl.textContent = '로그인 시도가 너무 많습니다. ' + mins + '분 후 다시 시도해주세요.';
        codeEl.value = '';
        setLoading(false);
        return;
      }
      if (!res.ok) throw new Error('네트워크 오류');

      var result = await res.json();
      if (result.valid && isJwtShaped(result.token)) {
        sessionStorage.setItem('hug_token', result.token);
        sessionStorage.setItem('hug_auth', '1');
        sessionStorage.setItem('hug_role', result.role || 'viewer');
        sessionStorage.setItem('hug_user', username);
        location.href = APP_PAGE;
        return;
      } else if (result.locked) {
        var m2 = Math.ceil((result.retry_after_seconds || 600) / 60);
        errEl.textContent = '로그인 시도가 너무 많습니다. ' + m2 + '분 후 다시 시도해주세요.';
        codeEl.value = '';
      } else if (result.expired) {
        errEl.textContent = '등록 기간이 만료됐습니다. 관리자에게 문의하세요.';
        codeEl.value = '';
      } else {
        errEl.textContent = '코드가 올바르지 않습니다. 앱을 확인해주세요.';
        codeEl.value = '';
      }
    } catch (e) {
      errEl.textContent = '서버 연결 오류. 잠시 후 다시 시도해주세요.';
    } finally {
      setLoading(false);
    }
  }

  btnEl.addEventListener('click', submit);
  codeEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  usernameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') codeEl.focus(); });
})();
</script>
